# Publie la version web (dossier www) et l'APK sur GitHub Pages à chaque push sur main.
# Les applis Android installées y trouvent version.json et proposent la mise à jour.
name: Publier Soirée Box
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # L'APK est publié à côté du jeu : l'appli le propose quand une mise à jour Android est nécessaire.
      - run: cp android/SoireeBox.apk www/SoireeBox.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
